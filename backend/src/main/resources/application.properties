spring.application.name=backend
server.port=8080

# Multipart Upload Limits (100MB to match frontend)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# External Tools Integration
# Detected Shotcut FFmpeg installation on Windows; can also be overridden or resolved via PATH
app.ffmpeg.path=C:/Program Files/Shotcut/ffmpeg.exe
app.libreoffice.path=

# Temporary Storage for conversions
app.conversion.temp-dir=${java.io.tmpdir}/flexconvert
