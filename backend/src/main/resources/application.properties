spring.application.name=backend
server.port=${PORT:8080}

# Multipart Upload Limits (100MB to match frontend)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS Configuration - reads from APP_CORS_ALLOWED_ORIGINS or falls back to local dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# External Tools Integration
# Supports environment override APP_FFMPEG_PATH, with fallback to Windows Shotcut path or system PATH
app.ffmpeg.path=${APP_FFMPEG_PATH:C:/Program Files/Shotcut/ffmpeg.exe}
app.libreoffice.path=${APP_LIBREOFFICE_PATH:}

# Temporary Storage for conversions
app.conversion.temp-dir=${APP_CONVERSION_TEMP_DIR:${java.io.tmpdir}/flexconvert}

